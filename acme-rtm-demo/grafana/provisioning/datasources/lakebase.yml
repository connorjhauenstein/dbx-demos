apiVersion: 1
datasources:
  - name: Lakebase
    uid: lakebase
    type: postgres
    url: ${LAKEBASE_HOST}:5432
    database: databricks_postgres
    user: grafana_reader
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      sslmode: require
      postgresVersion: 1600
    isDefault: true
