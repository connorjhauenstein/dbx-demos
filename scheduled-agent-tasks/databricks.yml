# Scheduled agent tasks: a job and an MLflow experiment for each folder in tasks/.
# MCPs are managed in Unity Gateway; tasks list the ones they use by name.
bundle:
  name: scheduled-agent-tasks

python:
  venv_path: .venv
  resources:
    - "resources:load_resources"

variables:
  service_principal:
    description: Application ID of the service principal the agents run as
  trace_catalog:
    description: Catalog for the MLflow trace tables
  trace_schema:
    description: Schema for the MLflow trace tables

permissions:
  - service_principal_name: ${var.service_principal}
    level: CAN_VIEW

targets:
  dev:
    default: true
