# Scheduled agent tasks. Each task names an agent (agents/), and the Unity Gateway MCPs and skills it needs.
# Shared MCPs and skills are deployed separately from platform/.
bundle:
  name: scheduled-agent-tasks

python:
  venv_path: .venv
  resources:
    - "resources:load_resources"

sync:
  exclude:
    - platform/**

variables:
  service_principal:
    description: Application ID of the service principal the agents run as
  platform_schema:
    description: Catalog and schema of the shared MCPs and skills (catalog.schema). Task names without a catalog resolve here.

permissions:
  - service_principal_name: ${var.service_principal}
    level: CAN_VIEW

targets:
  dev:
    default: true
