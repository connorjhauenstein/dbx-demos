# Shared, governed agent resources in Unity Gateway. Deployed by a platform team or admin.
# Tasks reference these by Unity Catalog name; they're also usable from any other Unity Gateway client.
bundle:
  name: agent-platform
  engine: direct

variables:
  schema:
    description: Catalog and schema that holds the shared MCP services, connections, and skills (catalog.schema)
  agents_principal:
    description: Service principal application ID or group name that may use them

resources:
  mcp_services:
    databricks_docs:
      parent: schemas/${var.schema}
      mcp_service_id: databricks_docs
      comment: Databricks Developer Docs (Apps, Agent Bricks, Unity Gateway, Lakebase, Jobs). Public, read-only.
      config:
        source_connection:
          name: connections/${var.schema}.databricks_docs
        include_tool_selectors: [list_docs_resources, get_doc_resource]
      grants:
        - principal: ${var.agents_principal}
          privileges: [EXECUTE]

targets:
  dev:
    default: true
