# Metric-view MCP: an MCP server that exposes only Unity Catalog metric views.
# Choose which metric views in config.yml, then:
#   databricks bundle deploy
#   databricks bundle run grant_metric_view_access
#   databricks bundle run metric_view_mcp
bundle:
  name: metric_view_mcp

variables:
  consumer_group:
    description: Group allowed to use the app and query the metric views
    default: account users
  warehouse_id:
    description: SQL warehouse for metric view queries (serverless, so it autoscales)
    lookup:
      warehouse: "Serverless Starter Warehouse"

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
