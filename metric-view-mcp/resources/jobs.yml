resources:
  jobs:
    # Rerun after changing config.yml or adding metric views.
    # Grants SELECT on each in-scope metric view to the app's service principal and the consumer group.
    grant_metric_view_access:
      name: metric-view-mcp-grant-access
      tasks:
        - task_key: grant
          notebook_task:
            notebook_path: ../jobs/grant_access.py
            base_parameters:
              app_name: ${resources.apps.metric_view_mcp.name}
              consumer_group: ${var.consumer_group}
