# Which metric views this MCP exposes: one entry per line, in any mix of
#   "*"                       every metric view the caller can see
#   catalog                   every metric view in a catalog
#   catalog.schema            every metric view in a schema
#   catalog.schema.view       one metric view
#
# Example:
#   include:
#     - prod.finance.revenue_metrics
#     - prod.finance.margin_metrics
#     - prod.marketing              # plus every metric view in this schema
#
# Users still only see the in-scope metric views they have access to in Unity Catalog.
# Redeploy and restart the app after changing this file.
include:
  - my_catalog.my_semantic_schema
