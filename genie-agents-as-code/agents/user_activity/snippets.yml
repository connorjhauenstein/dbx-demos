filters:
  - display_name: US users
    sql: users.country = 'US'
    synonyms:
      - domestic users
    instruction: Use when someone asks about the US or domestic users
  - display_name: mobile users
    sql: users.platform IN ('ios', 'android')
expressions:
  - alias: signup_month
    display_name: signup month
    sql: DATE_TRUNC('MONTH', users.signup_date)
    synonyms:
      - cohort
measures:
  - alias: signups
    display_name: signups
    sql: COUNT(DISTINCT users.user_id)
    synonyms:
      - new users
    instruction: Count of users who signed up
