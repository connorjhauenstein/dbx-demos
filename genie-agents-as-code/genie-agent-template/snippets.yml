# Reusable SQL Genie can apply. Prefer defining measures in a metric view; use these for Genie-only logic.
filters:                               # keyed by display_name
  - display_name: shipped orders
    sql: orders.status = 'SHIPPED'
    synonyms:
      - fulfilled
    instruction: Use when someone asks about shipped or fulfilled orders
expressions:                           # keyed by alias
  - alias: order_month
    display_name: order month
    sql: DATE_TRUNC('MONTH', orders.created_at)
measures:                              # keyed by alias
  - alias: order_count
    display_name: orders
    sql: COUNT(DISTINCT orders.order_id)
    synonyms:
      - number of orders
