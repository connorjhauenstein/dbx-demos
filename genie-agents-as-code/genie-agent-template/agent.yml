# Copy this folder to agents/<agent_name>/ and edit. `{schema}` means <catalog>.<schema>
# (passed to genie_as_code.py with --schema). Keys use the Genie UI's names; only title and sources are required.

# --- Configure > About
title: My Agent                        # Name
description: What this agent answers.  # Description
# warehouse_id: abc123                 # Warehouse (default: the bundle's warehouse_id variable)
permissions:                           # Share: CAN_MANAGE, CAN_EDIT, CAN_RUN, CAN_VIEW
  - level: CAN_RUN
    group_name: users
common_questions:                      # Common questions
  - What was revenue last month?

# --- Configure > Sources (Tables, Metric Views, SQL functions)
sources:
  - table: "{schema}.my_metric_view"   # metric views use `table:` too
  - table: "{schema}.my_table"
    description: What one row means.   # table Description
    columns:                           # per-column settings
      status:
        description: Order status      # Description
        synonyms:                      # Synonyms
          - state
        entity_matching: true          # Entity matching ("shipped" -> status = 'SHIPPED'); turns on format assistance
      created_at:
        format_assistance: true        # Format assistance
      internal_id:
        hidden: true                   # Hide column
  - table: "{schema}.my_other_table"
  - function: "{schema}.my_table_function"  # SQL functions: must be RETURNS TABLE; no DATE arguments (use STRING)

# extra:                               # written by `explode` for spec fields this tool doesn't model yet.
#   config: {...}                      # Merged into the spec as-is; you normally never edit this.
