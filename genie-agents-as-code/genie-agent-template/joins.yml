# Configure > Examples > Joins (not needed for metric views, which define their own joins).
- left:                                # Left Table
    table: "{schema}.my_table"
    alias: orders                      # API only (not shown in the UI); used in the condition
  right:                               # Right Table
    table: "{schema}.my_other_table"
    alias: customers
  condition: "`orders`.`customer_id` = `customers`.`customer_id`"   # Join condition
  relationship: many_to_one            # Relationship Type: many_to_one, one_to_many, one_to_one, many_to_many
  instructions: Join when a question needs customer attributes      # Instructions
  comment: Each order belongs to one customer                       # API only (not shown in the UI)
