bundle:
  name: genie_agents_as_code

variables:
  catalog:
    description: Catalog that holds the agents' tables and metric views
  schema:
    description: Schema that holds the agents' tables and metric views
    default: genie_as_code
  warehouse_id:
    description: SQL warehouse the Genie agents run on
    lookup:
      warehouse: Serverless Starter Warehouse

include:
  - .build/*.yml   # generated by `make build`; one genie_spaces resource per folder in agents/

sync:
  exclude:
    - demo/**

targets:
  dev:
    mode: development
    default: true
