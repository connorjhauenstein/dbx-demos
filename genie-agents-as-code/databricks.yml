bundle:
  name: genie_agents_as_code

variables:
  catalog:
    description: Catalog for the demo tables and metric views
  schema:
    description: Schema for the demo tables and metric views
    default: genie_as_code
  warehouse_id:
    description: SQL warehouse the Genie agents run on
    lookup:
      warehouse: Serverless Starter Warehouse

include:
  - resources/*.yml
  - .build/*.yml   # generated by `genie_as_code.py build`

targets:
  dev:
    mode: development
    default: true
